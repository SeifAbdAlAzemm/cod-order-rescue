# COD Order Rescue - runtime configuration.
#
# Every [simulation.*] section is a SIMULATION ASSUMPTION for the synthetic demo.
# None of them is verified merchant policy. Each must carry status = "SIMULATION_ASSUMPTION"
# (the loader rejects it otherwise). Rationale: docs/SIMULATION-ASSUMPTIONS.md.
#
# Secrets never live here. ANTHROPIC_API_KEY is read from the environment only.

[app]
db_path = "data/cod_rescue.sqlite3"
fixtures_dir = "data/fixtures"
currency = "EGP"

[llm]
# Provider selection is independent of execution mode: REPLAY (default) never calls a provider.
# Switch with COD_RESCUE_LLM_PROFILE=<name> or --profile <name>. Keys come from the env var NAMED
# by api_key_env (or a git-ignored .env) - never from this file.
active_profile = "anthropic-haiku"
max_tokens = 4096                 # per call; includes reasoning tokens where applicable
request_timeout_s = 30            # per attempt; capped further by the remaining per-event wall budget
max_retries = 2                   # SDK-level bounded retries for transient errors (429/5xx/network)

# pricing: "known" (nonzero prices), "verified_free" (zero price verified at a source/date),
# or "unknown" (LIVE refuses to run; missing pricing is never treated as free). USD per 1M tokens.
[llm.profiles.anthropic-haiku]
provider = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
pricing = "known"
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
pricing_source = "Anthropic published pricing (Claude API reference table, cached 2026-10-06)"
options = { effort = "medium" }

[llm.profiles.openrouter-gemma-free]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
model = "google/gemma-4-31b-it:free"
api_key_env = "OPENROUTER_API_KEY"
pricing = "verified_free"
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
pricing_source = "OpenRouter GET /api/v1/models: prompt=0, completion=0, supported_parameters includes tools (2026-10-10); re-verified before LIVE"
options = { openrouter_usage = true, app_title = "COD Order Rescue (hackathon MVP)" }

# Templates (NOT tested in this slice) - copy into a new [llm.profiles.<name>] table and fill in:
#   OpenRouter paid: provider="openai_compatible", base_url="https://openrouter.ai/api/v1", api_key_env="OPENROUTER_API_KEY", pricing="known"
#   Hugging Face:    provider="openai_compatible", base_url="https://router.huggingface.co/v1", api_key_env="HF_TOKEN"
#   OpenAI:          provider="openai_compatible", base_url="https://api.openai.com/v1", api_key_env="OPENAI_API_KEY", pricing="known"

# Hard stop conditions per processed customer event (enforced in code, not by the LLM).
[agent_budget]
max_llm_calls = 6
max_tool_calls = 8
max_wall_time_s = 60
max_input_tokens = 40000
max_output_tokens = 12000
max_cost_usd = 0.05
max_invalid_actions = 2           # malformed / unknown / disallowed tool calls before fail-closed stop
history_messages = 12             # recent conversation messages shown to the model

[simulation.duplicates]
status = "SIMULATION_ASSUMPTION"
window_hours = 24
# Same normalized customer phone AND identical item signature
# (multiset of sku/size/quantity). Overlapping SKUs alone do NOT match.
identity = "phone_normalized"
item_match = "exact_signature"
ignore_lifecycle_states = ["CANCELLED"]
# Clearing a duplicate needs explicit evidence (deterministic, the LLM cannot override):
# the reply must be the only customer message after the duplicate-intent question for THIS pair,
# every word must be in confirmation affirmatives/fillers or these words, and it must contain
# at least one affirmative AND one "both" word. "لا واحد بس" or anything conditional -> not cleared.
both_intended_words = ["الاتنين", "الاثنين", "الطلبين", "طلبين", "اتنين", "الاتنين", "منفصلين", "منفصله", "طلبات", "عايز", "عايزه", "هما", "both", "two", "separate", "want", "them"]
both_markers = ["الاتنين", "الاثنين", "الطلبين", "طلبين", "اتنين", "both", "two"]

[simulation.address]
status = "SIMULATION_ASSUMPTION"
required_fields = ["governorate", "city", "street", "building"]
optional_fields = ["district", "floor", "apartment", "landmark"]
# A landmark alone never substitutes for street + building.

[simulation.phone]
status = "SIMULATION_ASSUMPTION"
pattern = "^01[0125][0-9]{8}$"    # Egyptian mobile, after normalization

[simulation.clarification]
status = "SIMULATION_ASSUMPTION"
max_attempts = 3
on_exceeded = "ESCALATE_TO_HUMAN"

[simulation.pricing]
status = "SIMULATION_ASSUMPTION"
amounts_whole_egp = true
recheck_prices_at_commit = true
on_price_change = "INVALIDATE_CONFIRMATION_AND_HOLD"

[simulation.inventory]
status = "SIMULATION_ASSUMPTION"
reservation_point = "AT_READY_COMMIT"

[simulation.confirmation]
status = "SIMULATION_ASSUMPTION"
# A reply confirms only if ALL hold (deterministic, the LLM cannot override):
#  - it is the only customer message after the latest OPEN confirmation request,
#  - that request is bound to the current order version and current content hash,
#  - after normalization, every word is in short_affirmatives or filler_words,
#    at least one word is a short affirmative, and it is not a question.
# Anything else (e.g. "تمام بس غير المقاس", "تمام؟") -> not a confirmation; ask again.
short_affirmatives = ["تمام", "ماشي", "موافق", "موافقه", "أيوه", "ايوه", "اه", "اكيد", "أكد", "اكد", "ok", "okay", "yes", "confirm", "confirmed"]
filler_words = ["كده", "كدا", "يا", "فندم", "باشا", "شكرا", "الطلب", "الاوردر", "خلاص", "جدا", "please", "thanks", "the", "order"]
require_first_reply_after_request = true

[simulation.messaging]
status = "SIMULATION_ASSUMPTION"
mode = "SIMULATED_OUTBOX"         # the only permitted value in this MVP

# Test-only switches. All false for normal runs.
[simulation.fault_injection]
status = "SIMULATION_ASSUMPTION"
inventory_unavailable = false
shipping_rates_unavailable = false
price_source_unavailable = false
commit_timeout_after_success = false
ledger_unavailable = false
